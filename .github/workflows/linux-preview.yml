name: Linux preview
on:
  push:
    branches: [main]
    tags: ['v*-linux-preview.*']
  pull_request:
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'gary4juce.jucer'
      - 'packaging/linux/**'
      - 'tests/**'
      - '.github/workflows/linux-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install build and virtual-display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake pkg-config libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libgl1-mesa-dev xvfb xauth x11-utils openbox
      - name: Configure pinned JUCE and Release build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          version_args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version_args+=("-DGARY4JUCE_RELEASE_VERSION=${GITHUB_REF_NAME#v}")
          fi
          cmake -S . -B build-linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF "${version_args[@]}"
      - name: Build VST3 and standalone
        run: cmake --build build-linux-release --parallel 2
      - name: Verify stems installation and CPU separation
        run: |
          fixtures="$PWD/build-linux-release/stems-fixtures"
          mkdir -p "$fixtures"
          for part in core vulkan; do
            file="stems-v0.1.7-linux-${{ matrix.arch }}-$part.zip"
            curl -fL --retry 3 --connect-timeout 15 --max-time 180 -o "$fixtures/$file" \
              "https://github.com/betweentwomidnights/stems.cpp/releases/download/v0.1.7/$file"
          done
          model="uvr_denoise_lite-4M-v1.0-F32.gguf"
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 -o "$fixtures/$model" \
            "https://huggingface.co/thepatch/uvr-vr-GGUF/resolve/main/$model"
          cmake -S . -B build-linux-release -DBUILD_TESTING=ON -DGARY4JUCE_STEMS_TEST_FIXTURES="$fixtures"
          cmake --build build-linux-release --target gary_stems_runtime_test --parallel 2
          ctest --test-dir build-linux-release -R '^stems_runtime$' --output-on-failure
      - name: Smoke test standalone in Xvfb
        run: xvfb-run -a python3 tests/linux/with_window_manager.py python3 tests/linux/standalone_smoke.py build-linux-release/gary4juce_artefacts/Release/Standalone/gary4juce
      - name: Build and run Debug metadata regressions
        if: matrix.arch == 'x64'
        run: |
          cmake -S . -B build-linux-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DJUCE_SOURCE_DIR="$PWD/build-linux-release/_deps/juce-src"
          cmake --build build-linux-debug --target gary_output_metadata_test --parallel 2
          xvfb-run -a ctest --test-dir build-linux-debug --output-on-failure
      - name: Package and verify the clean tagged build
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 packaging/linux/package.py --build-dir build-linux-release --juce-dir build-linux-release/_deps/juce-src --tag "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .release/*.zip
            .release/SHA256SUMS-linux-*.txt
            .release/BUILD-INFO-linux-*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: linux-${{ matrix.arch }}-build-check
          if-no-files-found: error
          path: |
            build-linux-release/gary4juce_artefacts/Release/VST3/gary4juce.vst3
            build-linux-release/gary4juce_artefacts/Release/Standalone/gary4juce
